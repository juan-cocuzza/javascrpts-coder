<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carrito de Compras</title>
<link rel="stylesheet" href="/CSS/estilo.css" />
</head>
<body>
<h1>Simulador de Carrito</h1>

<form id="productForm">
    <input type="text" id="productName" placeholder="Ingrese Producto" required />
    <input type="number" id="productPrice" placeholder="Ingrese Precio" required />
    <button type="submit">Agregar</button>
</form>



<section id="cart"></section>

<button id="clearCartBtn">Vaciar carrito</button>

<script src="main.js"></script>
</body>
</html>
